<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>J.J.'s Combinatorics Sketchbook</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Combinatorics" />
<meta name="description" content="Chief Engineer's Counting Manual — J.J.'s Combinatorics Sketchbook." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #F1ECDD;
  --card: #FFFFFF;
  --ink: #16293A;
  --ink-soft: #5B6B78;
  --teal: #0E2A45;
  --teal-dark: #081826;
  --amber: #D9A441;
  --amber-dark: #B3822C;
  --coral: #C1503A;
  --success: #3FA37A;
  --success-bg: #E6F5EE;
  --nudge-bg: #FCEFD9;
  --nudge-ink: #8A5A18;
  --danger: #C0392B;
  --danger-bg: #FBEAE7;
  --mono: 'Space Mono', 'Courier New', monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #app { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    repeating-linear-gradient(0deg, rgba(14,42,69,0.035) 0px, rgba(14,42,69,0.035) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, rgba(14,42,69,0.035) 0px, rgba(14,42,69,0.035) 1px, transparent 1px, transparent 28px);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
}
button, input, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }

.wrap { max-width: 560px; margin: 0 auto; padding-bottom: 48px; }

/* ---- Header ---- */
.hdr {
  background: var(--teal); color: #fff; padding: 20px 18px 18px;
  border-bottom: 3px solid var(--amber); text-align: center; position: relative;
}
.hdr-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
.hdr-title { font-family: var(--mono); font-weight: 700; font-size: 21px; margin-top: 6px; letter-spacing: 0.01em; }
.hdr-sub { color: rgba(255,255,255,0.72); font-size: 12.5px; margin-top: 6px; }
.hdr-back {
  position: absolute; left: 14px; top: 18px; font-family: var(--mono); font-size: 12px;
  color: var(--amber); background: none; border: none; padding: 6px; font-weight: 700;
}

/* ---- Sections ---- */
.section { padding: 16px 16px 0; }
.section-label {
  font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px;
}

/* ---- Part progress ---- */
.voyage-card {
  background: var(--teal); color: #fff; border-radius: 10px; padding: 14px 16px;
  border: 2px dashed var(--amber); box-shadow: 0 3px 12px rgba(14,42,69,0.18);
}
.voyage-row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; }
.voyage-row .num { font-size: 13px; color: var(--amber); font-weight: 700; }
.voyage-track { height: 10px; background: rgba(255,255,255,0.18); border-radius: 6px; overflow: hidden; margin-top: 8px; }
.voyage-fill { height: 100%; background: linear-gradient(90deg, var(--amber), #fff); border-radius: 6px; transition: width .4s ease; }

/* ---- Chapter cards ---- */
.missions { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.mission-card {
  background: var(--card); border-radius: 10px; padding: 16px;
  box-shadow: 0 2px 10px rgba(14,42,69,0.10); border: 1px solid rgba(14,42,69,0.10);
  display: flex; flex-direction: column; gap: 10px;
}
.mission-card.locked { opacity: 0.55; }
.mission-top { display: flex; gap: 12px; align-items: flex-start; }
.mission-emoji {
  font-size: 24px; width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; background: var(--bg); border-radius: 8px; border: 1px dashed var(--amber-dark);
}
.mission-info { flex: 1; min-width: 0; }
.mission-name { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--teal); }
.mission-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.mission-stats {
  display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px;
  color: var(--ink-soft); background: var(--bg); border-radius: 6px; padding: 8px 10px;
}
.mission-stats .stat strong { color: var(--teal); }
.mission-btn {
  display: block; text-align: center; background: var(--teal); color: #fff; font-weight: 700;
  font-size: 13.5px; padding: 11px; border-radius: 8px; letter-spacing: 0.01em; border: none; width: 100%;
}
.mission-btn:disabled { background: var(--ink-soft); }
.mission-btn.boss { background: var(--coral); }
.stars { font-size: 13px; letter-spacing: 1px; }
.part-header {
  font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--teal);
  margin: 18px 0 4px; padding-left: 2px; letter-spacing: 0.02em;
}
.part-sub { font-size: 11.5px; color: var(--ink-soft); padding-left: 2px; margin-bottom: 6px; }

/* ---- Stage tracker ---- */
.stage-tracker { display: flex; gap: 6px; padding: 14px 16px 0; }
.stage-dot {
  flex: 1; text-align: center; padding: 7px 2px; border-radius: 7px; font-family: var(--mono);
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em; background: var(--card);
  color: var(--ink-soft); border: 1px solid rgba(14,42,69,0.12);
}
.stage-dot.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.stage-dot.done { background: var(--success-bg); color: #1e5c40; border-color: rgba(63,163,122,0.4); }

/* ---- Concept card ---- */
.concept-card {
  background: var(--card); border-radius: 12px; margin: 14px 16px 0; padding: 18px;
  border: 2px dashed var(--amber-dark); box-shadow: 0 2px 10px rgba(14,42,69,0.08);
}
.concept-eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--amber-dark); text-transform: uppercase; letter-spacing: 0.08em; }
.concept-title { font-family: var(--mono); font-weight: 700; font-size: 17px; color: var(--teal); margin-top: 4px; }
.concept-body { font-size: 14.5px; line-height: 1.55; color: var(--ink); margin-top: 10px; }
.concept-body p { margin: 0 0 10px; }
.concept-body strong { color: var(--teal); }
.callout {
  background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-top: 10px;
  border-left: 3px solid var(--amber); font-size: 13.5px; line-height: 1.5;
}
.callout.engineer { border-left-color: var(--teal); }

/* ---- Widgets: items row ---- */
.item-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.item-chip {
  font-family: var(--mono); font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 8px;
  background: var(--bg); border: 2px solid var(--teal); color: var(--teal); user-select: none;
}
.item-chip.picked { background: var(--teal); color: #fff; }
.item-chip.partner { box-shadow: 0 0 0 3px var(--success); }
.slot-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
.slot-box { min-width:74px; min-height:44px; padding:6px 8px; border:2px dashed var(--amber); border-radius:8px; text-align:center;
  font-family:var(--mono); font-size:10.5px; color:var(--amber); display:flex; align-items:center; justify-content:center; }
.item-chip.in-pick { opacity: 0.3; pointer-events: none; }
.lb-instruction { font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
.lb-current { font-family: var(--mono); font-size: 13px; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.lb-current strong { color: var(--teal); font-size: 15px; }

/* ---- Pool-shrink dot visual ---- */
.pool-steps { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.pool-step { text-align: center; min-width: 74px; }
.pool-step-label { font-family: var(--mono); font-size: 9.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; line-height: 1.4; }
.pool-dots { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; max-width: 110px; margin: 0 auto; }
.pool-dot {
  width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.pool-used-row { display: flex; gap: 3px; justify-content: center; margin-top: 6px; min-height: 16px; }
.pool-used-dot {
  width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 8px; font-weight: 700; color: #fff; opacity: 0.35;
}
.pool-arrow-col { text-align: center; font-size: 15px; color: var(--amber-dark); }
.pool-arrow-label { font-family: var(--mono); font-size: 9px; color: var(--coral); margin-top: 2px; white-space: nowrap; }

/* ---- List builder ---- */
.list-builder { margin-top: 12px; }
.lb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px,1fr)); gap: 8px; margin-top: 10px; }
.lb-cell {
  font-family: var(--mono); font-size: 13px; font-weight: 700; text-align: center; padding: 9px 4px;
  border-radius: 6px; border: 1.5px dashed var(--amber-dark); background: var(--bg); color: var(--ink-soft);
}
.lb-cell.found { background: var(--success-bg); border: 1.5px solid var(--success); color: #1e5c40; text-decoration: line-through; text-decoration-color: rgba(30,92,64,0.4); }
.lb-progress { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
.lb-btn-row { display: flex; gap: 8px; margin-top: 10px; }

/* ---- Buttons generic ---- */
.btn { border-radius: 8px; padding: 11px 14px; font-weight: 700; font-size: 13.5px; border: 2px solid var(--teal); background: transparent; color: var(--teal); }
.btn.primary { background: var(--teal); color: #fff; }
.btn.amber { border-color: var(--amber-dark); color: var(--amber-dark); background: var(--nudge-bg); }
.btn.small { padding: 8px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.4; }

/* ---- Answer check ---- */
.answer-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.answer-row input {
  flex: 1; padding: 11px 12px; border-radius: 8px; border: 2px solid var(--teal); font-family: var(--mono);
  font-size: 15px; font-weight: 700; color: var(--teal); text-align: center; min-width: 0;
}
.feedback { margin-top: 10px; font-size: 13.5px; font-weight: 600; padding: 9px 12px; border-radius: 8px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--success-bg); color: #1e5c40; }
.feedback.no { background: var(--danger-bg); color: var(--danger); }

/* ---- Nav row ---- */
.stage-nav { display: flex; gap: 10px; padding: 16px 16px 0; }
.stage-nav .btn { flex: 1; }

/* ---- Star bar ---- */
.star-bar {
  display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 0;
  font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
}

/* ---- SVG containers ---- */
.svg-box { margin-top: 12px; background: var(--bg); border-radius: 8px; padding: 8px; border: 1px dashed var(--amber-dark); overflow-x: auto; }
.svg-box svg { display: block; margin: 0 auto; }

/* ---- Grid table ---- */
.grid-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-family: var(--mono); font-size: 12px; }
.grid-table th, .grid-table td { border: 1px solid rgba(14,42,69,0.15); padding: 8px 4px; text-align: center; }
.grid-table th { background: var(--teal); color: #fff; }
.grid-table td.corner { background: var(--teal); color: #fff; }
.grid-table td.filled { background: var(--success-bg); color: #1e5c40; font-weight: 700; }

/* ---- Boss card ---- */
.boss-card { background: var(--teal-dark); color: #fff; border-radius: 12px; margin: 14px 16px 0; padding: 18px; border: 2px solid var(--coral); }
.boss-eyebrow { font-family: var(--mono); font-size: 11px; color: var(--coral); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.boss-title { font-family: var(--mono); font-weight: 700; font-size: 18px; margin-top: 4px; }
.boss-step { margin-top: 12px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 10px 12px; border-left: 3px solid var(--coral); }
.boss-step-label { font-family: var(--mono); font-size: 11px; color: var(--coral); font-weight: 700; }
.boss-step p { font-size: 13.5px; line-height: 1.5; margin: 6px 0 0; color: rgba(255,255,255,0.92); }

/* ---- Draw pad ---- */
.pad-box { margin-top: 12px; background: #fff; border-radius: 8px; border: 2px dashed var(--amber-dark); touch-action: none; }
.pad-box canvas { display: block; width: 100%; touch-action: none; border-radius: 8px; }
.pad-tools { display: flex; gap: 8px; margin-top: 8px; }

/* ---- Error log ---- */
.err-type-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.err-chip {
  font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 8px 10px; border-radius: 6px;
  border: 1.5px solid var(--ink-soft); color: var(--ink-soft); background: var(--card);
}
.err-chip.sel { background: var(--teal); color: #fff; border-color: var(--teal); }
.err-log-entry {
  background: var(--card); border-radius: 8px; padding: 10px 12px; margin-top: 8px;
  border: 1px solid rgba(14,42,69,0.1); font-size: 12.5px;
}
.err-log-entry .et { font-family: var(--mono); font-weight: 700; color: var(--coral); font-size: 11px; }
textarea.note {
  width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: 2px solid var(--teal);
  font-size: 13.5px; min-height: 60px; resize: vertical;
}

.foot-note { margin: 18px 16px 0; font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.6; }
.foot-note code { font-family: var(--mono); background: var(--card); padding: 1px 5px; border-radius: 4px; border: 1px solid rgba(14,42,69,0.1); }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
(function () {
"use strict";

/* =========================================================
   COMBINATORIAL GENERATORS — live algorithms, never pre-baked
   ========================================================= */

function kCombinations(arr, k) {
  var results = [];
  function helper(start, chosen) {
    if (chosen.length === k) { results.push(chosen.slice()); return; }
    for (var i = start; i < arr.length; i++) {
      chosen.push(arr[i]);
      helper(i + 1, chosen);
      chosen.pop();
    }
  }
  helper(0, []);
  return results;
}

function kPermutations(arr, k) {
  var results = [];
  function helper(chosen, used) {
    if (chosen.length === k) { results.push(chosen.slice()); return; }
    for (var i = 0; i < arr.length; i++) {
      if (used[i]) continue;
      used[i] = true;
      chosen.push(arr[i]);
      helper(chosen, used);
      chosen.pop();
      used[i] = false;
    }
  }
  helper([], {});
  return results;
}

function kSequences(arr, k) {
  // cartesian product, repeats allowed, order matters
  var results = [[]];
  for (var pos = 0; pos < k; pos++) {
    var next = [];
    for (var r = 0; r < results.length; r++) {
      for (var a = 0; a < arr.length; a++) {
        next.push(results[r].concat([arr[a]]));
      }
    }
    results = next;
  }
  return results;
}

function factorial(n) { var f = 1; for (var i = 2; i <= n; i++) f *= i; return f; }

function climbCompositions(n) {
  // All sequences of 1s and 2s that sum to n (ladder-climbing paths). Live recursive algorithm, never hardcoded.
  if (n === 0) return [[]];
  if (n < 0) return [];
  var results = [];
  climbCompositions(n - 1).forEach(function (seq) { results.push(seq.concat([1])); });
  climbCompositions(n - 2).forEach(function (seq) { results.push(seq.concat([2])); });
  return results;
}

/* =========================================================
   STORAGE
   ========================================================= */

var STORE_KEY = "cs_progress_v1";
var ERR_KEY = "cs_errorlog_v1";

function isPlainObject(o) { return !!o && typeof o === "object" && !Array.isArray(o); }
/* Turns ANY parsed value into a safe progress object, so a damaged or half-written save can never white-screen the app. */
function sanitizeProgress(p) {
  var out = { chapters: {}, xp: 0, drawMemory: {} };
  if (!isPlainObject(p)) return out;
  if (typeof p.xp === "number" && isFinite(p.xp) && p.xp >= 0) out.xp = p.xp;
  if (isPlainObject(p.drawMemory)) {
    Object.keys(p.drawMemory).forEach(function (k) { if (p.drawMemory[k] === true) out.drawMemory[k] = true; });
  }
  if (isPlainObject(p.chapters)) {
    Object.keys(p.chapters).forEach(function (id) {
      var c = p.chapters[id];
      if (!isPlainObject(c)) return;
      var stars = Number(c.stars);
      if (!isFinite(stars)) stars = 3;
      stars = Math.min(3, Math.max(1, Math.round(stars)));
      var stage = Number(c.stage);
      if (!isFinite(stage)) stage = 0;
      stage = Math.min(4, Math.max(0, Math.floor(stage)));
      var sd = [];
      for (var i = 0; i < 5; i++) sd.push(Array.isArray(c.stageDone) && c.stageDone[i] === true);
      out.chapters[id] = { stage: stage, stars: stars, done: c.done === true, stageDone: sd };
    });
  }
  return out;
}
function loadProgress() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    return sanitizeProgress(raw ? JSON.parse(raw) : null);
  } catch (e) { return sanitizeProgress(null); }
}
var storageFailed = false;   // true when the browser refuses to save (private mode, full, blocked)
function saveProgress(p) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); storageFailed = false; } catch (e) { storageFailed = true; }
}
function loadErrorLog() {
  try {
    var raw = localStorage.getItem(ERR_KEY);
    var list = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(list)) return [];
    return list.filter(function (e) { return isPlainObject(e) && typeof e.code === "string" && typeof e.note === "string"; });
  } catch (e) { return []; }
}
function saveErrorLog(list) {
  try { localStorage.setItem(ERR_KEY, JSON.stringify(list)); } catch (e) {}
}

var PROGRESS = loadProgress();

function getChapterState(chId) {
  if (!PROGRESS.chapters[chId]) {
    PROGRESS.chapters[chId] = { stage: 0, stars: 3, done: false, stageDone: [false,false,false,false,false] };
  }
  return PROGRESS.chapters[chId];
}
function useHint(chId) {
  var st = getChapterState(chId);
  if (st.stars > 1) st.stars -= 1;
  saveProgress(PROGRESS);
}
function markStageDone(chId, stageIdx) {
  var st = getChapterState(chId);
  var firstFinish = (stageIdx === 4 && !st.done);   // replaying a finished chapter must not farm XP
  st.stageDone[stageIdx] = true;
  if (stageIdx === 4) { st.done = true; if (firstFinish) PROGRESS.xp = (PROGRESS.xp || 0) + 20 + (st.stars * 5); }
  saveProgress(PROGRESS);
  refreshChapterNav();
}

/* =========================================================
   APP STATE / ROUTING
   ========================================================= */

var route = { view: "home", chapterId: null, stage: 0 };


/* =========================================================
   BACKUP SYSTEM (Ship's Log) — export / preview / restore
   ========================================================= */

var DRAW_KEY = "cs_drawings_v1";
var DRAW_MAX = 400000;   // characters per saved drawing
function cleanDrawings(o) {
  var out = {};
  if (!isPlainObject(o)) return out;
  Object.keys(o).forEach(function (id) {
    var v = o[id];
    if (/^(ch(1[0-2]|[1-9]))$/.test(id) && typeof v === "string" && v.length <= DRAW_MAX &&
        /^data:image\/(png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(v)) out[id] = v;
  });
  return out;
}
function loadDrawings() {
  try { return cleanDrawings(JSON.parse(localStorage.getItem(DRAW_KEY) || "null")); } catch (e) { return {}; }
}
function saveDrawings(d) {
  try { localStorage.setItem(DRAW_KEY, JSON.stringify(d)); return true; } catch (e) { return false; }
}

var BACKUP_APP = "jj-combinatorics-sketchbook-backup";
var BACKUP_META_KEY = "cs_backup_meta_v1";
var BACKUP_REMIND_DAYS = 7;

function backupStats(p) {
  var chaptersDone = 0, bossesDone = 0;
  Object.keys(p.chapters).forEach(function (id) {
    if (!p.chapters[id].done) return;
    if (id.indexOf("boss") === 0) bossesDone++; else chaptersDone++;
  });
  return { chapters: chaptersDone, bosses: bossesDone, xp: p.xp };
}
function hasAnyProgress() {
  var st = backupStats(PROGRESS);
  var started = Object.keys(PROGRESS.chapters).some(function (id) {
    var c = PROGRESS.chapters[id]; return c.stage > 0 || c.done || c.stageDone.some(Boolean);
  });
  return started || st.xp > 0 || loadErrorLog().length > 0 || Object.keys(loadDrawings()).length > 0;
}
function getBackupMeta() {
  try {
    var m = JSON.parse(localStorage.getItem(BACKUP_META_KEY) || "null");
    if (isPlainObject(m) && typeof m.last === "string" && isFinite(Date.parse(m.last))) return m;
  } catch (e) {}
  return null;
}
function setBackupMeta() {
  try { localStorage.setItem(BACKUP_META_KEY, JSON.stringify({ last: new Date().toISOString() })); } catch (e) {}
}
function backupAgeDays() {
  var m = getBackupMeta();
  return m ? Math.floor((Date.now() - Date.parse(m.last)) / 86400000) : null;
}

function buildBackup() {
  var d = new Date();
  var bundle = {
    app: BACKUP_APP, version: 1, exportedAt: d.toISOString(),
    progress: PROGRESS, errorLog: loadErrorLog(), drawings: loadDrawings()
  };
  var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  return { text: JSON.stringify(bundle, null, 2), fileName: "jj-combinatorics-backup-" + stamp + ".json", when: d };
}

/* Reads a backup file's text. Returns { ok:true, progress, errorLog, exportedAt } or { ok:false, msg }. */
function parseBackup(text) {
  var obj;
  try { obj = JSON.parse(text); } catch (e) { return { ok: false, msg: "That file isn't valid JSON, so I couldn't read it." }; }
  if (!isPlainObject(obj) || obj.app !== BACKUP_APP || !isPlainObject(obj.progress)) {
    return { ok: false, msg: "That doesn't look like a Combinatorics Sketchbook backup." };
  }
  var log = Array.isArray(obj.errorLog) ? obj.errorLog.filter(function (e) {
    return isPlainObject(e) && typeof e.code === "string" && typeof e.note === "string";
  }).map(function (e) { return { code: e.code, note: e.note.slice(0, 500), ts: Number(e.ts) || 0 }; }) : [];
  return { ok: true, progress: sanitizeProgress(obj.progress), errorLog: log, drawings: cleanDrawings(obj.drawings), exportedAt: obj.exportedAt };
}

function applyBackup(parsed) {
  PROGRESS = parsed.progress;
  saveProgress(PROGRESS);
  saveErrorLog(parsed.errorLog);
  saveDrawings(parsed.drawings || {});
  return !storageFailed;
}

function wireBackupUi() {
  var exp = document.getElementById("bk-export");
  var fileIn = document.getElementById("bk-file");
  if (!exp || !fileIn) return;
  function done(when) {
    setBackupMeta();
    var m = document.getElementById("bk-meta"); if (m) m.textContent = "Last backup: today (" + when.toLocaleTimeString() + ").";
    var n = document.getElementById("bk-nudge"); if (n) n.style.display = "none";
  }
  function download(b) {
    var blob = new Blob([b.text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = b.fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    done(b.when); bkStatus("✅ Backup file created. Keep it somewhere safe (Files, email or a cloud drive).", "ok");
  }
  exp.onclick = function () {
    if (!hasAnyProgress()) { bkStatus("Nothing to save yet. Do Step 1 of a chapter first, then come back.", "no"); return; }
    var b = buildBackup(), file = null;
    try { file = new File([b.text], b.fileName, { type: "application/json" }); } catch (e) {}
    var canShare = false;
    try { canShare = !!(file && navigator.share && navigator.canShare && navigator.maxTouchPoints > 0 && navigator.canShare({ files: [file] })); } catch (e) {}
    if (!canShare) { download(b); return; }
    navigator.share({ files: [file], title: "J.J.'s Combinatorics backup" }).then(function () {
      done(b.when); bkStatus("✅ Backup shared. Check you picked a safe place (Save to Files).", "ok");
    }).catch(function (err) {
      if (err && err.name === "AbortError") bkStatus("Share cancelled. No backup was saved. Tap again when you're ready.", "no");
      else download(b);
    });
  };
  fileIn.onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var res = parseBackup(String(r.result));
      fileIn.value = "";
      var box = document.getElementById("bk-preview");
      if (!res.ok) { box.innerHTML = ""; bkStatus(res.msg, "no"); return; }
      var inc = backupStats(res.progress), now = backupStats(PROGRESS);
      var when = res.exportedAt && isFinite(Date.parse(res.exportedAt)) ? new Date(res.exportedAt).toLocaleString() : "unknown date";
      var h = '<div class="callout engineer" style="margin-top:10px"><strong>This backup has:</strong><br>' +
        inc.chapters + ' of 12 chapters done · ' + inc.bosses + ' of 4 Boss Battles · ' + inc.xp + ' XP · ' + res.errorLog.length + ' Error Log entries · ' + Object.keys(res.drawings).length + ' saved drawings<br>' +
        '<span style="color:var(--ink-soft)">Saved: ' + escapeHtml(when) + '</span></div>';
      if (now.xp > inc.xp || now.chapters > inc.chapters) {
        h += '<div class="feedback show no" style="margin-top:8px">⚠ This iPad has MORE progress right now (' + now.chapters + ' chapters, ' + now.xp + ' XP). Restoring replaces it. Save a backup first if unsure.</div>';
      }
      h += '<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" id="bk-cancel" style="flex:1;min-height:48px">Cancel</button>' +
        '<button class="btn primary" id="bk-confirm" style="flex:1;min-height:48px">Restore This Backup</button></div>';
      box.innerHTML = h;
      document.getElementById("bk-cancel").onclick = function () { box.innerHTML = ""; };
      document.getElementById("bk-confirm").onclick = function () {
        var ok = applyBackup(res);
        if (ok) { nav("home"); setTimeout(function () { bkStatus("✅ Progress restored. Welcome back, Chief Engineer!", "ok"); }, 0); }
        else { box.innerHTML = ""; bkStatus("This browser wouldn't let me save. Open the app from its normal web address (not a private tab) and try again.", "no"); }
      };
    };
    r.onerror = function () { bkStatus("I couldn't read that file. Try picking it again.", "no"); };
    r.readAsText(f);
  };
}

function starsHtml(n) {

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildTreeSVG(rootLabel, level1, level2byParent, width) {
  // level1: array of labels. level2byParent: object label -> array of labels
  width = width || 520;
  var l1n = level1.length;
  var totalLeaves = 0;
  level1.forEach(function (p) { totalLeaves += level2byParent[p].length; });
  var height = 70 + totalLeaves * 30 + 40;
  var trunkX = 60, trunkY = 40;
  var svg = '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<text x="' + trunkX + '" y="' + (trunkY - 14) + '" font-family="Space Mono" font-size="12" font-weight="700" fill="#0E2A45">' + escapeHtml(rootLabel) + '</text>';
  svg += '<circle cx="' + trunkX + '" cy="' + trunkY + '" r="5" fill="#0E2A45" />';

  var l1x = 190;
  var leafIndex = 0;
  var l1positions = [];
  // compute vertical centers for each level1 branch based on its children count
  var cursorY = 55;
  level1.forEach(function (p, i) {
    var children = level2byParent[p];
    var blockHeight = children.length * 30;
    var centerY = cursorY + blockHeight / 2;
    l1positions.push(centerY);
    cursorY += blockHeight;
  });

  level1.forEach(function (p, i) {
    var y1 = l1positions[i];
    svg += '<line x1="' + trunkX + '" y1="' + trunkY + '" x2="' + l1x + '" y2="' + y1 + '" stroke="#D9A441" stroke-width="2" />';
    svg += '<circle cx="' + l1x + '" cy="' + y1 + '" r="4.5" fill="#D9A441" />';
    svg += '<text x="' + (l1x + 10) + '" y="' + (y1 + 4) + '" font-family="Space Mono" font-size="12" font-weight="700" fill="#0E2A45">' + escapeHtml(p) + '</text>';

    var children = level2byParent[p];
    var l2x = width - 110;
    var childStartY = l1positions[i] - (children.length * 30) / 2 + 15;
    children.forEach(function (c, j) {
      var y2 = childStartY + j * 30;
      svg += '<line x1="' + (l1x + 6) + '" y1="' + y1 + '" x2="' + l2x + '" y2="' + y2 + '" stroke="#0E2A45" stroke-width="1.5" opacity="0.55" />';
      svg += '<circle cx="' + l2x + '" cy="' + y2 + '" r="4" fill="#0E2A45" />';
      svg += '<text x="' + (l2x + 10) + '" y="' + (y2 + 4) + '" font-family="Space Mono" font-size="11.5" fill="#16293A">' + escapeHtml(c) + '</text>';
      leafIndex++;
    });
  });

  svg += '</svg>';
  return svg;
}

/* ---------- Generic list-builder widget (tap-to-build, crossing-out method) ---------- */
/* mode: 'combo' | 'perm' | 'seq'. chId used so the hint fallback costs a star, same as everywhere else. */
var CHIP_COLORS = ["#C1503A", "#3FA37A", "#0E2A45", "#D9A441", "#8A5A18", "#5B6B78"];

/* ---------- Pool-shrink dot visual (colored dots that physically disappear as roles get filled) ---------- */
/* pool: full array of letters, e.g. ["A","B","C","D","E"]
   pickedSequence: which letter is removed at each step, e.g. ["A","B"] (leaves the final remaining pool implicit)
   roleLabels: labels for each step, e.g. ["Captain","First Officer","Second Officer"] */
function poolShrinkVisualHtml(pool, pickedSequence, roleLabels) {
  function colorFor(letter) { return CHIP_COLORS[pool.indexOf(letter) % CHIP_COLORS.length]; }
  var html = '<div class="pool-steps">';
  var removedSoFar = [];
  for (var step = 0; step < roleLabels.length; step++) {
    var available = pool.filter(function (l) { return removedSoFar.indexOf(l) === -1; });
    html += '<div class="pool-step">';
    html += '<div class="pool-step-label">' + roleLabels[step].toUpperCase() + '<br>(' + available.length + ' available)</div>';
    html += '<div class="pool-dots">';
    available.forEach(function (l) { html += '<div class="pool-dot" style="background:' + colorFor(l) + '">' + l + '</div>'; });
    html += '</div>';
    html += '<div class="pool-used-row">';
    removedSoFar.forEach(function (l) { html += '<div class="pool-used-dot" style="background:' + colorFor(l) + '">' + l + '</div>'; });
    html += '</div>';
    html += '</div>';
    if (step < roleLabels.length - 1) {
      var picked = pickedSequence[step];
      html += '<div class="pool-arrow-col">→<div class="pool-arrow-label">' + picked + ' picked</div></div>';
      removedSoFar.push(picked);
    }
  }
  html += '</div>';
  return html;
}

var OFFICERS5 = ["A","B","C","D","E"];

function listBuilderWidget(containerId, items, k, mode, chId, onAllFound) {
  var target = mode === 'combo' ? kCombinations(items, k) : (mode === 'perm' ? kPermutations(items, k) : kSequences(items, k));
  var found = new Array(target.length).fill(false);
  var foundCount = 0;
  var current = [];
  var chipEls = [];

  function colorFor(item) {
    var idx = items.indexOf(item);
    return CHIP_COLORS[idx % CHIP_COLORS.length];
  }
  function sameUnordered(a, b) {
    if (a.length !== b.length) return false;
    var as = a.slice().sort(), bs = b.slice().sort();
    for (var i = 0; i < as.length; i++) if (as[i] !== bs[i]) return false;
    return true;
  }
  function sameOrdered(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function cellLabel(arr) { return arr.join(""); }

  function draw() {
    var html = '<p class="lb-instruction">Tap ' + k + ' flags to build your pick' + (mode === 'seq' ? ' (repeats allowed)' : '') + ':</p>';
    html += '<div class="item-row" id="' + containerId + '-items"></div>';
    html += '<div class="lb-current">Your pick: <strong id="' + containerId + '-currenttext">tap above</strong> ';
    html += '<button class="btn small" id="' + containerId + '-clear">Clear</button></div>';
    html += '<div class="feedback" id="' + containerId + '-fb"></div>';
    html += '<div class="lb-grid">';
    target.forEach(function (t, i) {
      html += '<div class="lb-cell' + (found[i] ? ' found' : '') + '" data-i="' + i + '">' + (found[i] ? cellLabel(t) : "?") + '</div>';
    });
    html += '</div>';
    html += '<div class="lb-progress">Found: ' + foundCount + ' / ' + target.length + '</div>';
    html += '<div class="lb-btn-row"><button class="btn small amber" id="' + containerId + '-hint">Stuck? Reveal one (uses a star)</button></div>';
    document.getElementById(containerId).innerHTML = html;

    var itemsRow = document.getElementById(containerId + "-items");
    chipEls = [];
    items.forEach(function (it) {
      var chip = document.createElement("div");
      chip.className = "item-chip";
      chip.style.borderColor = colorFor(it);
      chip.style.color = colorFor(it);
      chip.textContent = it;
      chip.onclick = function () {
        if (mode !== 'seq' && current.indexOf(it) !== -1) return;
        if (current.length >= k) return;
        current.push(it);
        refreshCurrent();
        if (current.length === k) submitPick();
      };
      itemsRow.appendChild(chip);
      chipEls.push({ item: it, el: chip });
    });

    document.getElementById(containerId + "-clear").onclick = function () {
      current = [];
      refreshCurrent();
      setFeedback("");
    };
    document.getElementById(containerId + "-hint").onclick = function () {
      useHint(chId);
      var idx = found.indexOf(false);
      if (idx === -1) return;
      found[idx] = true; foundCount++;
      current = [];
      draw();
      if (foundCount === target.length && onAllFound) onAllFound(target.length, true);
    };
  }

  function refreshCurrent() {
    var el = document.getElementById(containerId + "-currenttext");
    if (el) el.textContent = current.length ? current.join("") : "tap above";
    if (mode !== 'seq') {
      chipEls.forEach(function (c) {
        if (current.indexOf(c.item) !== -1) c.el.classList.add("in-pick");
        else c.el.classList.remove("in-pick");
      });
    }
  }
  function setFeedback(html, cls) {
    var fb = document.getElementById(containerId + "-fb");
    if (!fb) return;
    if (!html) { fb.className = "feedback"; fb.textContent = ""; return; }
    fb.className = "feedback show" + (cls ? " " + cls : "");
    fb.innerHTML = html;
  }

  function submitPick() {
    var matchIdx = -1;
    for (var i = 0; i < target.length; i++) {
      var isMatch = mode === 'combo' ? sameUnordered(target[i], current) : sameOrdered(target[i], current);
      if (isMatch) { matchIdx = i; break; }
    }
    if (matchIdx === -1) {
      setFeedback("That combination isn't valid here — try again.", "no");
      current = [];
      refreshCurrent();
      return;
    }
    if (found[matchIdx]) {
      setFeedback("You already found " + cellLabel(current) + (mode === 'combo' ? " (same bundle, different order)" : "") + " — try a different one.", "no");
      current = [];
      refreshCurrent();
      return;
    }
    found[matchIdx] = true;
    foundCount++;
    var justFinished = foundCount === target.length;
    current = [];
    draw();
    setFeedback("✅ Found it — " + cellLabel(target[matchIdx]) + "!", "ok");
    if (justFinished && onAllFound) onAllFound(target.length);
  }

  draw();
  return target.length;
}

/* ---------- Cross-product builder (heterogeneous dials, tap one option per group in order) ---------- */
function crossBuilderWidget(containerId, groups, chId, onAllFound) {
  var target = [[]];
  groups.forEach(function (g) {
    var next = [];
    target.forEach(function (partial) {
      g.options.forEach(function (opt) { next.push(partial.concat([opt])); });
    });
    target = next;
  });
  var found = new Array(target.length).fill(false);
  var foundCount = 0;
  var current = [];

  function cellLabel(arr) { return arr.join(" + "); }

  function draw() {
    var html = '';
    groups.forEach(function (g, gi) {
      html += '<p class="lb-instruction" style="margin-top:' + (gi === 0 ? '0' : '12') + 'px">' + g.label + '</p>';
      html += '<div class="item-row" id="' + containerId + '-g' + gi + '"></div>';
    });
    html += '<div class="lb-current">Your pick: <strong id="' + containerId + '-currenttext">tap above</strong> ';
    html += '<button class="btn small" id="' + containerId + '-clear">Clear</button></div>';
    html += '<div class="feedback" id="' + containerId + '-fb"></div>';
    html += '<div class="lb-grid">';
    target.forEach(function (t, i) {
      html += '<div class="lb-cell' + (found[i] ? ' found' : '') + '" data-i="' + i + '">' + (found[i] ? cellLabel(t) : "?") + '</div>';
    });
    html += '</div>';
    html += '<div class="lb-progress">Found: ' + foundCount + ' / ' + target.length + '</div>';
    html += '<div class="lb-btn-row"><button class="btn small amber" id="' + containerId + '-hint">Stuck? Reveal one (uses a star)</button></div>';
    document.getElementById(containerId).innerHTML = html;

    groups.forEach(function (g, gi) {
      var row = document.getElementById(containerId + '-g' + gi);
      g.options.forEach(function (opt) {
        var chip = document.createElement('div');
        chip.className = 'item-chip';
        chip.textContent = opt;
        chip.onclick = function () {
          if (current.length !== gi) return;
          current.push(opt);
          refreshCurrent();
          if (current.length === groups.length) submitPick();
        };
        row.appendChild(chip);
      });
    });

    document.getElementById(containerId + '-clear').onclick = function () {
      current = [];
      refreshCurrent();
      setFeedback("");
    };
    document.getElementById(containerId + '-hint').onclick = function () {
      useHint(chId);
      var idx = found.indexOf(false);
      if (idx === -1) return;
      found[idx] = true; foundCount++;
      current = [];
      draw();
      if (foundCount === target.length && onAllFound) onAllFound(target.length, true);
    };
  }

  function refreshCurrent() {
    var el = document.getElementById(containerId + '-currenttext');
    if (el) el.textContent = current.length ? current.join(' + ') : 'tap above';
  }
  function setFeedback(html, cls) {
    var fb = document.getElementById(containerId + '-fb');
    if (!fb) return;
    if (!html) { fb.className = 'feedback'; fb.textContent = ''; return; }
    fb.className = 'feedback show' + (cls ? ' ' + cls : '');
    fb.innerHTML = html;
  }

  function submitPick() {
    var matchIdx = -1;
    for (var i = 0; i < target.length; i++) {
      if (target[i].length === current.length && target[i].every(function (v, idx) { return v === current[idx]; })) { matchIdx = i; break; }
    }
    if (matchIdx === -1) {
      setFeedback("Hmm, that combination isn't valid — try again.", "no");
      current = [];
      refreshCurrent();
      return;
    }
    if (found[matchIdx]) {
      setFeedback("Already found " + cellLabel(current) + " — try a different combo.", "no");
      current = [];
      refreshCurrent();
      return;
    }
    found[matchIdx] = true;
    foundCount++;
    var justFinished = foundCount === target.length;
    current = [];
    draw();
    setFeedback("✅ Found it!", "ok");
    if (justFinished && onAllFound) onAllFound(target.length);
  }

  draw();
  return target.length;
}

function guidedExplanationWidget(containerId, chId, stageIdx, tokens) {
  var blankTokens = tokens.filter(function (t) { return t.t === "blank"; });

        bi++;

    });

  function drawGuided() {
    var html = '<div class="callout engineer" style="font-size:14.5px;line-height:1.7">' + sentenceHtml() + '</div>';

    if (current < blankTokens.length) {

        var chip = document.createElement("div");
        chip.className = "item-chip";
        chip.textContent = opt;
        chip.onclick = function () {

      };

/* ---------- Progressive hint widget (stacking hints, last level always states the answer) ---------- */
/* levels: array of { label: '💡 Hint 1', html: '...' } */
function progressiveHintWidget(containerId, chId, levels) {
  var shown = 0;
  function draw() {
    var html = "";
    for (var i = 0; i < shown; i++) {
      html += '<div class="callout engineer" style="margin-top:10px"><strong>' + levels[i].label + '</strong><br>' + levels[i].html + '</div>';
    }
    if (shown < levels.length) {
      html += '<button class="btn small amber" id="' + containerId + '-next" style="margin-top:10px">' + (shown === 0 ? "💡 Need a hint?" : (shown === levels.length - 1 ? "💡 Show the answer (uses a star)" : "💡 Next hint (uses a star)")) + '</button>';
    }
    document.getElementById(containerId).innerHTML = html;
    var btn = document.getElementById(containerId + "-next");
    if (btn) btn.onclick = function () {
      if (shown > 0) useHint(chId);
      shown++;
      draw();
    };
  }
  draw();
}

/* Auto-built 3-level hint ladder (strategy -> set-up -> the answer), chosen by the kind of stage the check lives in.
   House rule: the final level states the answer outright, so nobody is ever stuck. */
function autoHintLevels(containerId, correctValue) {
  var kind = "generic";
  if (/^boss/.test(containerId)) kind = "boss";
  else if (/-s4-check2$/.test(containerId)) kind = "stretch";
  else if (/-s4-check1$/.test(containerId)) kind = "cambridge";
  else if (/-s0-/.test(containerId)) kind = "visual";
  else if (/-s1-|-c\d+$/.test(containerId)) kind = "strategy";
  else if (/-s2-/.test(containerId)) kind = "rule";
  var L = {
    visual:   ["Step 1 beats perfection: point at ONE object, then the next, and count out loud.",
               "Cross off each one as you count it, so nothing gets counted twice."],
    strategy: ["Shrink it! Try a tiny version (2 or 3 items) and list every case by hand. Then spot the pattern.",
               "Go row by row: fix the first choice, list everything that can follow it, then move to the next first choice."],
    rule:     ["Use the rule you just discovered. What do you multiply (or add) for each choice?",
               "Write one number per choice (multiply) or per case (add). Does each pick use up an option? Then the next number is smaller."],
    cambridge:["Engineer's checklist: (1) does order matter? (2) can things repeat? (3) is anyone restricted? Answer those three first.",
               "Pick your tool from the checklist, write the number sentence, THEN calculate."],
    stretch:  ["Start from your Cambridge answer. The special rule removes some cases or changes one choice. Which one?",
               "Handle the restricted choice FIRST (it has the fewest options), then fill the rest freely. Or count everything and subtract the forbidden cases."],
    boss:     ["Boss tip: take ONE step at a time. Each answer feeds the next step.",
               "Name the tool for this step (multiply choices, shrink the pool, divide by orderings, or restriction). Write the number sentence, then calculate."],
    generic:  ["Step 1: make a tiny version of the problem and count it by hand.",
               "Write the count as a number sentence, then check it against your tiny version."]
  };
  var pair = L[kind];
  return [
    { label: "💡 Hint 1 — Strategy", html: pair[0] },
    { label: "💡 Hint 2 — Set it up", html: pair[1] },
    { label: "💡 Hint 3 — The answer", html: "The answer is <strong>" + correctValue + "</strong>. Type it in to move on, then ask yourself: how did the numbers get to " + correctValue + "? That is the real win." }
  ];
}

/* ---------- Generic answer-check widget (with built-in layered hints) ---------- */
function answerCheckWidget(containerId, correctValue, onCorrect, opts) {
  opts = opts || {};
  var wrong = 0, solved = false;
  var html = '<div class="answer-row"><input type="number" id="' + containerId + '-input" placeholder="Your count" />';
  html += '<button class="btn primary small" id="' + containerId + '-check">Check</button></div>';
  html += '<div class="feedback" id="' + containerId + '-fb"></div>';
  if (!opts.noHints) html += '<div id="' + containerId + '-hints"></div>';
  document.getElementById(containerId).innerHTML = html;
  if (!opts.noHints) {
    var m = /^(ch\d+|boss\d+)/.exec(containerId);
    progressiveHintWidget(containerId + "-hints", m ? m[1] : containerId, autoHintLevels(containerId, correctValue));
  }
  document.getElementById(containerId + "-check").onclick = function () {
    if (solved) return;
    var raw = document.getElementById(containerId + "-input").value;
    var v = parseInt(raw, 10);
    var fb = document.getElementById(containerId + "-fb");
    fb.className = "feedback show";
    if (raw === "" || isNaN(v)) {
      fb.classList.add("no");
      fb.textContent = "Type a number first. Any guess is a fine Step 1: engineers test, then adjust.";
    } else if (v === correctValue) {
      solved = true;
      fb.classList.add("ok");
      fb.textContent = "✅ Correct — " + correctValue + ". Nice counting.";
      document.getElementById(containerId + "-input").disabled = true;
      document.getElementById(containerId + "-check").disabled = true;
      var hb = document.getElementById(containerId + "-hints"); if (hb) hb.innerHTML = "";
      if (onCorrect) onCorrect();
    } else {
      wrong++;
      fb.classList.add("no");
      fb.textContent = wrong >= 2
        ? "Not yet, and that's normal: engineers iterate. Tap 💡 for a hint, then try again."
        : "Not quite. Try recounting systematically: nothing skipped, nothing doubled.";
    }
  };
}

/* Refreshes ONLY the star bar, stage tracker, and Next Stage button — never touches #stage-content,
   so an in-progress widget (e.g. "Reviewed: 8/8") never gets wiped back to its initial state
   just because the stage's completion condition was newly met. */
function refreshChapterNav() {
  if (route.view !== "chapter") return;
  var chId = route.chapterId, stageIdx = route.stage;
  var chromeEl = document.getElementById("chapter-chrome");
  if (chromeEl) chromeEl.innerHTML = chapterChromeHtml(chId, stageIdx);
  var navEl = document.getElementById("chapter-stage-nav");
  if (navEl) navEl.innerHTML = chapterNavHtml(chId, stageIdx);
}

function renderChapter(chId, stageIdx) {
  var meta = CHAPTER_META[chId];
  var st = getChapterState(chId);
  if (stageIdx > st.stage) stageIdx = st.stage; // can't skip ahead of progress
  st.stage = Math.max(st.stage, stageIdx);
  saveProgress(PROGRESS);

  var html = '';
  html += '<div class="hdr"><button class="hdr-back" onclick="CSApp.nav(\'home\')">‹ Chart Room</button>';
  html += '<div class="hdr-eyebrow">Ch.' + meta.num + ' &middot; Part ' + meta.part + '</div>';

  html += '<div id="chapter-chrome">' + chapterChromeHtml(chId, stageIdx) + '</div>';

  html += '<div class="concept-card" id="stage-content"></div>';

  html += '<div id="chapter-stage-nav">' + chapterNavHtml(chId, stageIdx) + '</div>';

function hintCurrentChapter(chId) {
  /* Best case: advance the hint ladder of the question J.J. is working on (no screen rebuild). */
  var btns = document.querySelectorAll('button[id$="-hints-next"]');
  if (btns.length) {
    var btn = btns[0];
    var box = btn.parentNode;
    btn.click();
    if (box && typeof box.scrollIntoView === "function") box.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  var idx = (route.view === "chapter" && route.stage >= 0 && route.stage <= 4) ? route.stage : 0;
  var text = (route.view === "chapter") ? NUDGES[idx] : "Do just the next step on the list. Read it, try it, check it. One step at a time.";
  var slot = document.getElementById("hint-slot");
  if (!slot) {
    slot = document.createElement("div");

  }

function nextStage(chId, currentStageIdx) {
  var st = getChapterState(chId);
  if (st.stageDone[currentStageIdx] && st.stage < currentStageIdx + 1) {
    st.stage = currentStageIdx + 1;
    saveProgress(PROGRESS);
  }

}

/* =========================================================
   DRAW-FROM-MEMORY
   ========================================================= */

var DRAW_PROMPTS = {
  ch1: "Draw the difference between CHOOSE and ARRANGE, using 3 signal flags — no looking back at the chapter.",
  ch2: "Draw the crossing-out method for pairing 3 officers into first &amp; second watch.",
  ch3: "Draw a tree diagram for 2 pressure settings × 3 valve settings, from memory.",
  ch4: "Draw an empty 3×3 cabin grid and label what rows × columns tells you.",
  ch5: "Draw two separate tool piles (3 wrenches, 2 spanners) and show why OR means adding the piles.",
  ch6: "Draw the wireless room's three dials and show how multiplying straight across gives the total.",
  ch7: "Draw the shrinking pool for assigning 3 roles from 4 officers — show the numbers getting smaller.",
  ch8: "Draw one team of 3 people and all the different orders it could have been picked in — show why you divide.",
  ch9: "Draw the 4 funnels and show why you fill the restricted slot (Position 1) before any other slot.",
  ch10: "Draw the Total circle split into Good and Bad pieces, and show why Good = Total minus Bad.",
  ch11: "Draw the ladder-climbing table for ways(1) through ways(4) and show the last-step rule.",
  ch12: "Draw your own toolbox with all 8 tools and one signal word that tells you when to use each one."
};

function renderDrawMemory(chId) {
  var meta = CHAPTER_META[chId];
  var html = '';
  html += '<div class="hdr"><button class="hdr-back" onclick="CSApp.nav(\'home\')">‹ Chart Room</button>';
  html += '<div class="hdr-eyebrow">Closed-Book Review</div>';
  html += '<div class="hdr-title">🧠 Draw From Memory</div>';
  html += '<div class="hdr-sub">' + meta.title + '</div></div>';

  html += '<div class="concept-card">';
  html += '<div class="concept-body"><p>' + DRAW_PROMPTS[chId] + '</p>';
  html += '<p style="color:var(--ink-soft);font-size:12.5px">Close the chapter in your mind first. Sketch on the pad below with your finger or mouse.</p>';
  html += '<div class="pad-box"><canvas id="draw-canvas" height="260"></canvas></div>';
  html += '<div id="pad-saved-note" style="display:none;font-size:12.5px;color:var(--ink-soft);margin-top:6px">📌 Your saved drawing is loaded. Add to it, or tap Clear to start fresh.</div>';
  html += '<div class="pad-tools"><button class="btn small" id="pad-clear">Clear</button></div>';
  html += '<button class="btn primary" id="pad-done" style="margin-top:14px;width:100%">I drew it from memory ✓</button>';
  html += '</div></div>';

  document.getElementById("app").innerHTML = html;

  var canvas = document.getElementById("draw-canvas");
  var ctx = canvas.getContext("2d");
  var cssW = canvas.clientWidth || 320;
  function paper() { ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, cssW, 260); }
  function fit() { canvas.width = cssW * 2; canvas.height = 260 * 2; ctx.scale(2,2); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#0E2A45"; paper(); }
  fit();
  var saved = loadDrawings()[chId];
  if (saved && typeof Image !== "undefined") {
    var img = new Image();
    img.onload = function () { ctx.drawImage(img, 0, 0, cssW, 260); };
    img.src = saved;
    var note = document.getElementById("pad-saved-note"); if (note) note.style.display = "block";
  }
  var drawing = false, lastX = 0, lastY = 0;
  function pos(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx, y: cy };
  }
  function start(e) { drawing = true; var p = pos(e); lastX = p.x; lastY = p.y; e.preventDefault(); }
  function move(e) {
    if (!drawing) return;
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y; e.preventDefault();
  }
  function end() { drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);

  document.getElementById("pad-clear").onclick = function () { paper(); };
  document.getElementById("pad-done").onclick = function () {
    PROGRESS.drawMemory[chId] = true;
    saveProgress(PROGRESS);
    try {
      var url = canvas.toDataURL("image/png");
      if (url.length > DRAW_MAX) url = canvas.toDataURL("image/jpeg", 0.6);
      if (url.length <= DRAW_MAX) { var all = loadDrawings(); all[chId] = url; saveDrawings(all); }
    } catch (e) {}
    nav("home");
  };
}

/* =========================================================
   ERROR LOG
   ========================================================= */

var ERR_TYPES = [
  { code: "A", label: "Misread", desc: "Read the question wrong" },
  { code: "B", label: "Double Count", desc: "Counted the same thing twice" },
  { code: "C", label: "Missing Case", desc: "Forgot a case" },
  { code: "D", label: "Wrong Strategy", desc: "Used the wrong counting method" },
  { code: "E", label: "Calculation", desc: "Arithmetic slip" },
  { code: "F", label: "Explanation", desc: "Right answer, couldn't explain why" }
];

function renderErrorLog() {
  var log = loadErrorLog();
  var html = '';
  html += '<div class="hdr"><button class="hdr-back" onclick="CSApp.nav(\'home\')">‹ Chart Room</button>';
  html += '<div class="hdr-eyebrow">Chief Engineer\'s Journal</div>';
  html += '<div class="hdr-title">🔥 Error Log</div>';
  html += '<div class="hdr-sub">Mistakes aren\'t "wrong" — they\'re a type. Name the type, fix the type.</div></div>';

  html += '<div class="section"><div class="concept-card">';
  html += '<div class="concept-title">Log a Mistake</div>';
  html += '<div class="concept-body">';
  html += '<div class="err-type-row" id="err-type-row">';
  ERR_TYPES.forEach(function (t) {
    html += '<div class="err-chip" data-code="' + t.code + '">' + t.code + ' &middot; ' + t.label + '</div>';
  });
  html += '</div>';
  html += '<textarea class="note" id="err-note" placeholder="What happened, in one line?"></textarea>';
  html += '<button class="btn primary small" id="err-save" style="margin-top:10px">Save to Log</button><div id="err-msg" style="margin-top:8px;font-size:12.5px;color:var(--danger)"></div>';
  html += '</div></div></div>';

  html += '<div class="section"><div class="section-label">Past Entries</div>';
  if (log.length === 0) {
    html += '<div class="callout">No entries yet — that\'s a good sign, or you just haven\'t logged one.</div>';
  } else {
    log.slice().reverse().forEach(function (e) {
      var t = ERR_TYPES.filter(function (x) { return x.code === e.code; })[0];
      html += '<div class="err-log-entry"><span class="et">' + e.code + ' &middot; ' + (t ? t.label : "") + '</span><div>' + escapeHtml(e.note) + '</div></div>';
    });
  }
  html += '</div>';

  document.getElementById("app").innerHTML = html;

  var selected = null;
  var chips = document.querySelectorAll("#err-type-row .err-chip");
  chips.forEach(function (chip) {
    chip.onclick = function () {
      chips.forEach(function (c) { c.classList.remove("sel"); });
      chip.classList.add("sel");
      selected = chip.getAttribute("data-code");
    };
  });
  document.getElementById("err-save").onclick = function () {
    var note = document.getElementById("err-note").value.trim();
    if (!selected || !note) { var fb = document.getElementById("err-msg");
      if (fb) fb.textContent = "Pick an error type and write a one-line note first.";
      return; }
    log.push({ code: selected, note: note, ts: Date.now() });
    saveErrorLog(log);
    renderErrorLog();
  };
}
